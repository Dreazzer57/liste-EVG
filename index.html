<!--📍 Où modifier dans le fichier HTML
🔹 Les 11 items de la liste → lignes 368 à 380
let items = [
  "Une bouée",                         // ← ligne 397
  "Un décapsuleur",                    // ← 
  "Une lotion Solaire",                // ← 
  "De la crème pour brûlure",          // ← 
  "Un tire-bouchon",                   // ← 
  "6 chaussettes différentes",         // ← 
  "Un anorak",                         // ← 
  "2 paires de chaussures différentes",// ← 
  "1 Nez rouge",                       // ← 
  "Des palmes",                        // ← 
  "Un déguisement de princesse"        // ← 
];
👉 Modifiez simplement le texte entre guillemets. Pour ajouter/retirer un item, ajoutez/retirez une ligne (pensez à la virgule , à la fin sauf pour le dernier).

🔹 Les messages après validation → lignes 411
let messages = [
  { min: 0,  max: 0,  icon: "📝", text: "Rien de coché pour l'instant — c'est parti, à vous de jouer !" },  // ← ligne 382
  { min: 1,  max: 3,  icon: "💤", text: "Très peu d'éléments cochés — continuez vos efforts !" },           // ← ligne 383
  { min: 4,  max: 6,  icon: "🌱", text: "Bon début, plus de la moitié reste à faire." },                    // ← ligne 384
  { min: 7,  max: 9,  icon: "🚀", text: "Excellent travail, vous êtes sur la bonne voie !" },               // ← ligne 385
  { min: 10, max: 10, icon: "⭐", text: "Presque parfait, encore un petit effort !" },                       // ← ligne 386
  { min: 11, max: 11, icon: "🏆", text: "Félicitations ! Liste complétée à 100% !" }                        // ← ligne 387
];
Pour chaque palier vous pouvez modifier :

min / max : la plage de cases cochées concernée
icon : l'emoji affiché (ex : "🎉", "😎", "🔥"…)
text : le message affiché
⚠️ Assurez-vous que les plages min–max couvrent bien toutes les valeurs possibles de 0 à 11, sans trou ni chevauchement. -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EVG • Checklist Raclette</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fff8f3;
    --bg-secondary: #fff1e8;
    --bg-tertiary: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    --text: #2b1d18;
    --text-secondary: #7a5c52;
    --text-tertiary: #b0897d;
    --border: rgba(120,60,30,0.12);
    --border-hover: rgba(120,60,30,0.24);

    --teal-50: #fff4d6;
    --teal-400: #ff7b54;
    --teal-600: #d95d39;
    --teal-200: #ffd56b;

    --accent-pink: #ff4d8d;
    --accent-yellow: #ffd166;
    --accent-orange: #ff9f1c;
    --accent-red: #ff5a5f;

    --radius-md: 10px;
    --radius-lg: 18px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-tertiary);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
    position: relative;
    overflow-x: hidden;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  body::before {
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.35) 0 18px, transparent 19px),
      radial-gradient(circle at 85% 25%, rgba(255,77,141,0.20) 0 28px, transparent 29px),
      radial-gradient(circle at 25% 80%, rgba(255,209,102,0.22) 0 22px, transparent 23px),
      radial-gradient(circle at 70% 75%, rgba(255,90,95,0.18) 0 26px, transparent 27px);
  }

  body::after {
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.8) 2px, transparent 2px),
      radial-gradient(circle, rgba(255,255,255,0.6) 1.5px, transparent 1.5px);
    background-size: 60px 60px, 90px 90px;
    background-position: 0 0, 30px 30px;
    opacity: 0.35;
  }

  .app {
    max-width: 580px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 1rem;
    color: #7a1f3d;
    text-shadow: 0 2px 10px rgba(255,255,255,0.45);
  }

  h1::after {
    content: "🎉 EVG • Raclette Party 🧀";
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent-pink);
    margin-top: 8px;
  }

  .hero-banner {
    text-align: center;
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.5);
    color: #7a1f3d;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 999px;
    margin-bottom: 1.5rem;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }

  .config-toggle {
    font-size: 12px;
    color: var(--text-secondary);
    border: 0.5px solid var(--border-hover);
    background: rgba(255,255,255,0.75);
    padding: 6px 12px;
    border-radius: var(--radius-md);
    cursor: pointer;
    margin-bottom: 1.5rem;
    transition: background 0.15s;
  }
  .config-toggle:hover { background: var(--bg-secondary); }

  .config-panel, .result, .item, .tab-panel, .tabs {
    backdrop-filter: blur(10px);
  }

  .config-panel {
    background: rgba(255,255,255,0.72);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
  }

  .config-panel h3 {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-tertiary);
    margin-bottom: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .config-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .config-item input[type=text], .msg-row input[type=text] {
    flex: 1;
    font-size: 14px;
    padding: 6px 10px;
    border: 0.5px solid var(--border-hover);
    border-radius: var(--radius-md);
    background: rgba(255,255,255,0.9);
    color: var(--text);
    height: 34px;
    outline: none;
  }

  .config-section { margin-bottom: 1rem; }
  .config-msgs { display: flex; flex-direction: column; gap: 6px; }
  .msg-row { display: grid; grid-template-columns: 90px 1fr; gap: 8px; align-items: center; }
  .msg-row span { font-size: 12px; color: var(--text-tertiary); }

  .apply-btn {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 600;
    color: white;
    border: none;
    background: linear-gradient(135deg, var(--accent-pink), var(--accent-orange));
    padding: 8px 14px;
    border-radius: var(--radius-md);
    cursor: pointer;
  }

  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 0.5px solid var(--border);
    margin-bottom: 1.25rem;
  }

  .tab-btn {
    background: transparent;
    border: none;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }

  .tab-btn.active {
    color: var(--accent-pink);
    border-bottom-color: var(--accent-pink);
  }

  .tab-badge {
    display: inline-block;
    margin-left: 6px;
    background: rgba(255,255,255,0.7);
    color: var(--text-secondary);
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 10px;
    font-weight: 600;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .counter-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
  .counter-text { font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
  .progress { flex: 1; height: 6px; background: rgba(255,255,255,0.5); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent-pink), var(--accent-orange)); border-radius: 999px; transition: width 0.35s ease; }

  .checklist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.5rem; }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: rgba(255,255,255,0.78);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    cursor: pointer;
    user-select: none;
  }

  .item.checked { border-color: var(--accent-orange); background: #fff7e8; }

  .checkbox {
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--border-hover);
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .item.checked .checkbox {
    background: linear-gradient(135deg, var(--accent-pink), var(--accent-orange));
    border-color: var(--accent-pink);
  }

  .check-svg { opacity: 0; }
  .item.checked .check-svg { opacity: 1; }

  .label-text { font-size: 15px; color: var(--text); flex: 1; }
  .item.checked .label-text {
    color: var(--teal-600);
    text-decoration: line-through;
    text-decoration-color: var(--teal-200);
  }

  .validate-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent-pink), var(--accent-orange));
    color: white;
    border: none;
    border-radius: var(--radius-lg);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .result {
    padding: 1.5rem;
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border);
    background: rgba(255,255,255,0.78);
    text-align: center;
  }

  .result-icon { font-size: 48px; margin-bottom: 12px; }
  .result-score { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
  .result-msg { font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.45; }
  .message-hint { margin-top: 1rem; text-align: center; font-size: 12px; color: var(--text-tertiary); }
</style>
</head>
<body>
<div class="app">
  <h1>Ma liste de vérification</h1>
  <div class="hero-banner">🧀 Appareil à raclette prêt pour la soirée ✨</div>

  <button class="config-toggle" onclick="toggleConfig()">⚙ Configurer la liste</button>

  <div class="config-panel" id="configPanel" style="display:none">
    <div class="config-section">
      <h3>Éléments de la liste</h3>
      <div id="itemsConfig"></div>
    </div>
    <div class="config-section">
      <h3>Messages selon le score</h3>
      <div class="config-msgs" id="msgsConfig"></div>
    </div>
    <button class="apply-btn" onclick="applyConfig()">Appliquer</button>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="list" onclick="switchTab('list')">Liste</button>
    <button class="tab-btn" id="tabMessageBtn" data-tab="message" onclick="switchTab('message')" style="display:none">Message <span class="tab-badge" id="tabBadge">0/11</span></button>
  </div>

  <div class="tab-panel active" id="panel-list">
    <div class="counter-bar">
      <span class="counter-text" id="counterText">0 / 11 cochés</span>
      <div class="progress"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div class="checklist" id="checklist"></div>
    <button class="validate-btn" onclick="validate()">Valider</button>
  </div>

  <div class="tab-panel" id="panel-message">
    <div class="result" id="result">
      <div class="result-icon" id="resultIcon">📝</div>
      <div class="result-score" id="resultScore">0 sur 11 éléments validés</div>
      <div class="result-msg" id="resultMsg">Cochez des éléments dans la liste pour voir votre message.</div>
    </div>
    <div class="message-hint">Le message se met à jour automatiquement selon les éléments cochés.</div>
  </div>
</div>

<script>
const CONFIG_PASSWORD = "280598";

let items = [
  "Une bouée",
  "Un décapsuleur",
  "Une lotion solaire",
  "De la crème pour brûlure",
  "Un tire-bouchon",
  "6 chaussettes différentes",
  "Un anorak",
  "2 paires de chaussures différentes",
  "1 nez rouge",
  "Des palmes",
  "Un déguisement de princesse"
];

let messages = [
  { min: 0,  max: 0,  icon: "📝", text: "Rien de coché ? Gage maximal !" },
  { min: 1,  max: 3,  icon: "👸)", text: "Liste incomplète, Voici tes gages : Demain matin, tu dois partir habillé en princesse ! Et Demain soir, tu auras une liste de tâches à réaliser  en portant un habit précis que nous te fournirons! Malheureusement, aucun de tes acolytes ne pourra t'aider, Bon courage" },
  { min: 4,  max: 6,  icon: "👸", text: "Liste incomplète, Voici tes gages : Demain matin, tu dois partir habillé en princesse ! Et Demain soir, tu auras une liste de tâches à réaliser  en portant un habit précis que nous te fournirons! Malheureusement, aucun de tes acolytes ne pourra t'aider, Bon courage." },
  { min: 7,  max: 9,  icon: "👸", text: "Liste incomplète, Voici tes gages : Demain matin, tu dois partir habillé en princesse ! Et Demain soir, tu auras une liste de tâches à réaliser  en portant un habit précis que nous te fournirons! Malheureusement, aucun de tes acolytes ne pourra t'aider, Bon courage" },
  { min: 10, max: 11, icon: "👸", text: "Liste incomplète, Voici tes gages : Demain matin, tu dois partir habillé en princesse ! Et Demain soir, tu auras une liste de tâches à réaliser  en portant un habit précis que nous te fournirons! Malheureusement, aucun de tes acolytes ne pourra t'aider, Bon courage" },
  { min: 11, max: 11, icon: "👸", text: "Liste incomplète, Voici tes gages : Demain matin, tu dois partir habillé en princesse ! Et Demain soir, tu auras une liste de tâches à réaliser  en portant un habit précis que nous te fournirons! Malheureusement, aucun de tes acolytes ne pourra t'aider, Bon courage" }
];

let checked = new Array(items.length).fill(false);

function renderChecklist() {
  const el = document.getElementById('checklist');
  el.innerHTML = '';
  items.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'item' + (checked[i] ? ' checked' : '');
    div.innerHTML = `
      <div class="checkbox">
        <svg class="check-svg" width="12" height="10" viewBox="0 0 12 10" fill="none">
          <polyline points="1,5 4.5,8.5 11,1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="label-text">${escapeHtml(item)}</span>`;
    div.onclick = () => toggle(i, div);
    el.appendChild(div);
  });
  updateCounter();
  updateMessage();
}

function toggle(i, el) {
  checked[i] = !checked[i];
  el.classList.toggle('checked', checked[i]);
  updateCounter();
  updateMessage();
  hideMessageTab();
}

function updateCounter() {
  const n = checked.filter(Boolean).length;
  const total = items.length;
  document.getElementById('counterText').textContent = `${n} / ${total} cochés`;
  document.getElementById('progressFill').style.width = total ? (n / total * 100) + '%' : '0%';
  document.getElementById('tabBadge').textContent = `${n}/${total}`;
}

function getMessageFor(n) {
  return messages.find(m => n >= m.min && n <= m.max) || messages[messages.length - 1];
}

function updateMessage() {
  const n = checked.filter(Boolean).length;
  const total = items.length;
  const msg = getMessageFor(n);
  document.getElementById('resultIcon').textContent = msg.icon;
  document.getElementById('resultScore').textContent = `${n} sur ${total} élément${n > 1 ? 's' : ''} validé${n > 1 ? 's' : ''}`;
  document.getElementById('resultMsg').textContent = msg.text;
}

function validate() {
  updateMessage();
  document.getElementById('tabMessageBtn').style.display = '';
  switchTab('message');
}

function hideMessageTab() {
  const btn = document.getElementById('tabMessageBtn');
  if (btn) btn.style.display = 'none';
  const messagePanel = document.getElementById('panel-message');
  if (messagePanel && messagePanel.classList.contains('active')) switchTab('list');
}

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
}

function toggleConfig() {
  const p = document.getElementById('configPanel');
  if (p.style.display === 'none') {
    const entered = prompt('Mot de passe requis pour accéder à la configuration :');
    if (entered !== CONFIG_PASSWORD) {
      alert('Mot de passe incorrect.');
      return;
    }
    buildConfigUI();
    p.style.display = 'block';
  } else {
    p.style.display = 'none';
  }
}

function buildConfigUI() {
  const ic = document.getElementById('itemsConfig');
  ic.innerHTML = '';
  items.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'config-item';
    row.innerHTML = `<label style="min-width:26px;font-size:12px;color:var(--text-tertiary)">${i + 1}.</label><input type="text" id="item_${i}" value="${escapeAttr(item)}" />`;
    ic.appendChild(row);
  });

  const mc = document.getElementById('msgsConfig');
  mc.innerHTML = '';
  messages.forEach((m, i) => {
    const row = document.createElement('div');
    row.className = 'msg-row';
    const range = m.min === m.max ? `${m.min}` : `${m.min}–${m.max}`;
    row.innerHTML = `<span>${range} ✓ &nbsp;${m.icon}</span><input type="text" id="msg_${i}" value="${escapeAttr(m.text)}" />`;
    mc.appendChild(row);
  });
}

function applyConfig() {
  items = items.map((orig, i) => document.getElementById('item_' + i).value.trim() || orig);
  messages = messages.map((m, i) => ({ ...m, text: document.getElementById('msg_' + i).value.trim() || m.text }));
  checked = new Array(items.length).fill(false);
  renderChecklist();
  document.getElementById('configPanel').style.display = 'none';
  hideMessageTab();
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(str) {
  return str.replace(/"/g,'&quot;');
}

renderChecklist();
</script>
</body>
</html>
